name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'yarn'
    - name: Install dependencies
      run: npm install -g yarn && yarn install --frozen-lockfile
    - name: Run ESLint
      run: yarn eslint .

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'yarn'
    - name: Install dependencies
      run: npm install -g yarn && yarn install --frozen-lockfile
    - name: Run Unit Tests
      run: yarn test:unit

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'yarn'
    - name: Install dependencies
      run: npm install -g yarn && yarn install --frozen-lockfile
    - name: Run Integration Tests
      run: yarn test:integration

  test-e2e:
    name: E2E Tests (${{ matrix.project }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: [lint, test-unit] # Wait for faster checks to pass
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
      POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRES_URL_NO_SSL: ${{ secrets.POSTGRES_URL_NO_SSL }}
      POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_ANDROID_FIREBASE_CREDENTIAL: ${{ secrets.VITE_ANDROID_FIREBASE_CREDENTIAL }}
      VITE_FIREBASE_CREDENTIAL: ${{ secrets.VITE_FIREBASE_CREDENTIAL }}
      VITE_IOS_FIREBASE_CREDENTIAL: ${{ secrets.VITE_IOS_FIREBASE_CREDENTIAL }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      VITE_MESSAGING_SENDER_ID: ${{ secrets.VITE_MESSAGING_SENDER_ID }}
      VITE_MEASUREMENT_ID: ${{ secrets.VITE_MEASUREMENT_ID }}
      # VITE_ Vars for build process
      VITE_DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
      VITE_POSTGRES_DATABASE: ${{ secrets.POSTGRES_DATABASE }}
      VITE_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      VITE_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      VITE_POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'yarn'
    - name: Install dependencies
      run: npm install -g yarn && yarn install --frozen-lockfile
    - name: Install Playwright Browsers
      run: yarn playwright install --with-deps
    - name: Build Application
      run: yarn build
    - name: Run Playwright tests
      run: yarn playwright test --project=${{ matrix.project }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.project }}
        path: playwright-report/
        retention-days: 30
